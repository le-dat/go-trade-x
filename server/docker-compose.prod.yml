services:
  api-gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        SERVICE_NAME: api-gateway
    environment:
      - APP_PORT=8080
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/gotradex?sslmode=disable
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy

  user-service:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        SERVICE_NAME: user-service
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/gotradex?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  order-service:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        SERVICE_NAME: order-service
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/gotradex?sslmode=disable
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy

  matching-engine:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        SERVICE_NAME: matching-engine
    environment:
      - KAFKA_BROKERS=kafka:9092

  market-service:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        SERVICE_NAME: market-service
    environment:
      - KAFKA_BROKERS=kafka:9092