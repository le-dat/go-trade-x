name: Pull Request Check

on:
  pull_request:
    branches:
      - main

jobs:
  backend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src/server
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run Tests
        run: go test -v ./...

  docker-dry-run:
    runs-on: ubuntu-latest
    needs: [backend-check]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Dry-run Backend Docker Build (API Gateway)
        uses: docker/build-push-action@v5
        with:
          context: ./src/server
          file: ./src/server/docker/Dockerfile
          build-args: SERVICE_NAME=api-gateway
          push: false
          tags: backend-test:latest
