services:
  postgres:
    ports:
      - "5436:5432"

  kafka:
    ports:
      - "9092:9092"

  api-gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        SERVICE_NAME: api-gateway
    ports:
      - "8080:8080"
    environment:
      - APP_PORT=8080
      - DATABASE_URL=postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-gotradex}?sslmode=disable
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  user-service:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        SERVICE_NAME: user-service
    ports:
      - "50051:50051"
    environment:
      - DATABASE_URL=postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-gotradex}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  order-service:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        SERVICE_NAME: order-service
    environment:
      - DATABASE_URL=postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-gotradex}?sslmode=disable
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  matching-engine:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        SERVICE_NAME: matching-engine
    environment:
      - KAFKA_BROKERS=kafka:9092
    networks:
      - backend

  market-service:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        SERVICE_NAME: market-service
    ports:
      - "8081:8081"
    environment:
      - KAFKA_BROKERS=kafka:9092
    networks:
      - backend