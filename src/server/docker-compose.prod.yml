services:
  postgres:
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  kafka:
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  api-gateway:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/gotradex-api-gateway:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        SERVICE_NAME: api-gateway
    environment:
      - APP_PORT=8080
      - DATABASE_URL=${DATABASE_URL}
      - KAFKA_BROKERS=${KAFKA_BROKERS:-kafka:9092}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  user-service:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/gotradex-user-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        SERVICE_NAME: user-service
    environment:
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  order-service:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/gotradex-order-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        SERVICE_NAME: order-service
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - KAFKA_BROKERS=${KAFKA_BROKERS:-kafka:9092}
      - USER_SERVICE_ADDR=user-service:50051
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  matching-engine:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/gotradex-matching-engine:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        SERVICE_NAME: matching-engine
    environment:
      - KAFKA_BROKERS=${KAFKA_BROKERS:-kafka:9092}
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  market-service:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/gotradex-market-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        SERVICE_NAME: market-service
    environment:
      - KAFKA_BROKERS=${KAFKA_BROKERS:-kafka:9092}
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M